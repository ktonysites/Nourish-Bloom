<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Post | Nourish & Bloom</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* --- GLOBAL STYLES --- */
        body {
            background: #f4f4f4;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        .split-container {
            display: flex;
            min-height: 100vh;
            width: 100%;
        }

        /* --- LEFT SIDE: DESKTOP IMAGE --- */
        .image-section {
            flex: 1;
            /* Your Image */
            background: url('WhatsApp Image 2025-12-15 at 12.30.29.jpeg') no-repeat center center;
            background-size: cover;
            position: relative;
            min-height: 400px;
            
            /* Vibrant Filters */
            filter: saturate(1.3) contrast(1.1) brightness(1.05);
        }

        /* Desktop Gradient Overlay */
        .image-section::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to right, rgba(0,0,0,0) 80%, rgba(0,0,0,0.05) 100%);
        }

        /* --- RIGHT SIDE: FORM --- */
        .form-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 4rem 3rem;
            background: #ffffff;
            z-index: 10;
        }

        .section-header {
            text-align: left;
            margin-bottom: 2rem;
        }

        .section-header h2 {
            color: var(--primary);
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .section-header p {
            color: #666;
            font-size: 1rem;
        }

        .modern-form {
            width: 100%;
            max-width: 500px;
        }

        /* Image Preview Box */
        #imagePreview {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            display: block;
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .hidden-preview {
            display: none !important;
        }

        /* --- 📱 MOBILE OPTIMIZATIONS (The Fix) --- */
        @media (max-width: 768px) {
            .split-container {
                flex-direction: column; /* Stack vertically */
                display: block; /* Removes flex stretching issues */
            }

            .image-section {
                /* 1. Make image taller on mobile */
                height: 50vh; 
                width: 100%;
                /* Ensure the top of the head/food isn't cut off */
                background-position: center top; 
                position: fixed; /* Parallax effect: Image stays still while form scrolls */
                top: 0;
                left: 0;
                z-index: -1; /* Put it behind the form */
            }

            .form-section {
                /* 2. The "Sheet" Effect */
                margin-top: 45vh; /* Push form down so image shows */
                background: white;
                border-top-left-radius: 30px; /* Rounded top corners */
                border-top-right-radius: 30px;
                padding: 2.5rem 1.5rem;
                box-shadow: 0 -10px 20px rgba(0,0,0,0.1); /* Shadow pointing up */
                min-height: 60vh;
                position: relative; /* Sit on top of image */
            }

            .section-header h2 {
                font-size: 1.8rem; /* Slightly smaller text for mobile */
            }
        }
    </style>
</head>
<body> 

    <nav class="navbar glass-effect" style="background: rgba(255,255,255,0.95);">
        <div class="logo">Nourish<span>&</span>Bloom</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="create.html" class="active-link" style="color: var(--primary);">Create Post</a></li> 
        </ul>
    </nav>

    <div class="split-container">
        
        <div class="image-section"></div>

        <div class="form-section">
            
            <div class="section-header">
                <h2>Create a Post</h2>
                <p>Share your recipes, workouts, and health tips with the community.</p>
            </div>

            <form id="create-form" class="modern-form">
                
                <div class="form-group">
                    <label>Cover Image</label>
                    <div style="border: 2px dashed var(--primary); background: #f9fdf9; padding: 20px; text-align: center; border-radius: 10px; cursor: pointer; transition: 0.3s;" onclick="document.getElementById('imageUpload').click()" onmouseover="this.style.background='#ecf7ec'" onmouseout="this.style.background='#f9fdf9'">
                        <p id="uploadText" style="color: var(--primary); font-weight: 600; margin: 0;">📸 Click to Upload Photo</p>
                        <img id="imagePreview" src="" class="hidden-preview">
                    </div>
                    <input type="file" id="imageUpload" accept="image/*" onchange="window.handleImageSelect(this)" style="display: none;">
                </div>

                <div class="form-group">
                    <label>Post Title</label>
                    <input type="text" id="postTitle" placeholder="e.g. My Morning Smoothie Routine" required>
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <select id="postCategory" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-family: 'Open Sans', sans-serif;">
                        <option value="Recipes">🥦 Recipes</option>
                        <option value="Health Tips">🩺 Health Tips</option>
                        <option value="Lifestyle">🌿 Lifestyle</option>
                        <option value="Fitness">💪 Fitness & Workout</option>
                        <option value="Mental Health">🧠 Mental Health</option>
                        <option value="Success Stories">✨ Success Stories</option>
                        <option value="Nutrition Science">🔬 Nutrition Science</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Content</label>
                    <textarea id="postContent" rows="6" placeholder="Write your story here..." required></textarea>
                </div>

                <button type="button" class="btn btn-primary full-width" onclick="window.submitPost()">Publish Post</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDoXIKF7OhfB8Ly5F80MKvIqqXavbfgGhg",
            authDomain: "gillian-nutrition-db.firebaseapp.com",
            databaseURL: "https://gillian-nutrition-db-default-rtdb.firebaseio.com",
            projectId: "gillian-nutrition-db",
            storageBucket: "gillian-nutrition-db.firebasestorage.app",
            messagingSenderId: "9582534930",
            appId: "1:9582534930:web:ac63d26318488bf858d3cb"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let uploadedImageBase64 = "";

        // --- IMAGE HANDLING ---
        window.handleImageSelect = function(input) {
            const preview = document.getElementById('imagePreview');
            const uploadText = document.getElementById('uploadText');
            const file = input.files[0];

            if (!file) return;

            // Security & Size Check
            if (!file.type.startsWith('image/')) {
                alert("⛔ Please upload an image file (JPG or PNG).");
                return;
            }
            if (file.size > 2000000) {
                 alert("⚠️ Image is too large! Please use a file under 2MB.");
                 return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.classList.remove('hidden-preview');
                uploadText.style.display = 'none'; // Hide the text once image shows
                uploadedImageBase64 = e.target.result; 
            }
            reader.readAsDataURL(file);
        }

        // --- SUBMIT FUNCTION ---
        window.submitPost = function() {
            const title = document.getElementById('postTitle').value;
            const category = document.getElementById('postCategory').value;
            const content = document.getElementById('postContent').value;
            
            if(title.length < 5) { alert("Please enter a longer title."); return; }
            if(content.length < 10) { alert("Please write a bit more content."); return; }

            const btn = document.querySelector('.btn-primary'); 
            btn.innerText = "Publishing...";
            btn.disabled = true;

            // Use uploaded image OR default green placeholder
            const imageToSave = uploadedImageBase64 || "https://images.unsplash.com/photo-1490645935967-10de6ba17061?auto=format&fit=crop&w=600&q=80";

            const postListRef = ref(db, 'posts');
            const newPostRef = push(postListRef);

            set(newPostRef, {
                title: title,
                category: category,
                content: content,
                date: Date.now(),
                image: imageToSave 
            })
            .then(() => {
                alert("✅ Success! Your post is live.");
                window.location.href = "index.html"; 
            })
            .catch((error) => {
                console.error("Error:", error);
                alert("Error: " + error.message);
                btn.innerText = "Publish Post";
                btn.disabled = false;
            });
        }
    </script>

</body>
</html>
